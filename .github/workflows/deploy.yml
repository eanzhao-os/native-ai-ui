name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check generated Vanilla styles
        run: npm run vanilla:styles:check

      - name: Check repository integrity
        run: npm run registry:check

      - name: Run tests
        run: npm test -- --run --no-file-parallelism

      - name: Type-check
        run: npm run typecheck

      - name: Build static site with Next.js
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"

      - name: Compare React and Vanilla visuals
        run: npm run visual:parity

      - name: Smoke-test the Pages export
        run: npm run pages:smoke

      - name: Upload visual parity artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity
          path: .artifacts/visual-parity
          if-no-files-found: ignore

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
